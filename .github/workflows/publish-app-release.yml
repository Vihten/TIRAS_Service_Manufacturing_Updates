name: Publish Windows application release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing stable release tag (vMAJOR.MINOR.PATCH)
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: publish-windows-application
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - name: Preserve release asset bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          persist-credentials: false
      - name: Validate assets, upload payload first, verify, and publish
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          function Invoke-Gh {
            param([Parameter(ValueFromRemainingArguments = $true)][string[]]$Arguments)
            $output = & gh @Arguments
            if ($LASTEXITCODE -ne 0) { throw "GitHub CLI failed: $($Arguments[0]) $($Arguments[1])" }
            return $output
          }
          function Get-StableVersion {
            param([string]$ReleaseTag)
            if ($ReleaseTag -cnotmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
              throw 'Expected a stable vMAJOR.MINOR.PATCH tag.'
            }
            return [version]$ReleaseTag.Substring(1)
          }
          function Assert-PublicFeed {
            param($Feed)
            $feedVersion = Get-StableVersion $Feed.tag_name
            $feedTag = $Feed.tag_name
            $feedPrefix = "TIRAS-Service-Manufacturing-$($feedTag.Substring(1))"
            $feedNames = @("$feedPrefix-payload.7z", "$feedPrefix-Online-Setup-x64.exe", "$feedPrefix-windows-x64.update.json", 'SHA256SUMS.txt')
            if ($feedTag -ceq 'v1.0.3' -or $Feed.draft -isnot [bool] -or $Feed.draft -or
                $Feed.prerelease -isnot [bool] -or $Feed.prerelease -or
                $Feed.html_url -cne "https://github.com/$env:GH_REPO/releases/tag/$feedTag" -or
                $Feed.body -isnot [string] -or [string]::IsNullOrWhiteSpace($Feed.body) -or
                @($Feed.assets).Count -ne 4) { throw 'Invalid public update feed.' }
            $seenNames = [Collections.Generic.HashSet[string]]::new([StringComparer]::Ordinal)
            foreach ($feedAsset in $Feed.assets) {
              if ($feedAsset.name -cnotin $feedNames -or -not $seenNames.Add($feedAsset.name) -or
                  ($feedAsset.size -isnot [int] -and $feedAsset.size -isnot [long]) -or $feedAsset.size -le 0 -or
                  $feedAsset.browser_download_url -cne "https://github.com/$env:GH_REPO/releases/download/$feedTag/$($feedAsset.name)") {
                throw 'Invalid public update feed asset.'
              }
            }
          }
          function Test-CanPromoteRelease {
            param([string]$CandidateTag, [string]$LatestTag, [string]$FeedTag)
            if ($CandidateTag -ceq 'v1.0.3') { throw 'Version v1.0.3 has been withdrawn.' }
            $candidateVersion = Get-StableVersion $CandidateTag
            return ((Get-StableVersion $LatestTag) -le $candidateVersion -and
                    (Get-StableVersion $FeedTag) -le $candidateVersion)
          }
          $tag = $env:RELEASE_TAG
          if ($env:GH_REPO -cne 'Vihten/TIRAS_Service_Manufacturing_Updates') {
            throw 'This workflow publishes only the public Manufacturing updates repository.'
          }
          if ($tag -cnotmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw 'Expected a stable vMAJOR.MINOR.PATCH tag.'
          }
          if ($tag -ceq 'v1.0.3') { throw 'Version v1.0.3 has been withdrawn and must not be republished.' }
          $version = $tag.Substring(1)
          $prefix = "TIRAS-Service-Manufacturing-$version"
          $installer = "$prefix-Online-Setup-x64.exe"
          $payload = "$prefix-payload.7z"
          $manifestName = "$prefix-windows-x64.update.json"
          $assetNames = @($payload, $installer, $manifestName, 'SHA256SUMS.txt')
          $root = Join-Path 'release-assets' $tag
          $files = @(Get-ChildItem -LiteralPath $root -Force)
          if ($files.Count -ne $assetNames.Count -or
              @($files | Where-Object { $_.PSIsContainer -or $_.Name -cnotin $assetNames }).Count -ne 0) {
            throw 'Release directory must contain exactly the four approved public assets.'
          }
          $tracked = @(& git ls-files)
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect public repository files.' }
          foreach ($path in $tracked) {
            if ($path -ceq 'README.md' -or $path -ceq 'latest.json' -or $path -ceq '.github/workflows/publish-app-release.yml') { continue }
            if ($path -cnotmatch '^release-assets/(v(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*))/(?:SHA256SUMS\.txt|TIRAS-Service-Manufacturing-[0-9]+\.[0-9]+\.[0-9]+-(?:Online-Setup-x64\.exe|payload\.7z|windows-x64\.update\.json))$') {
              throw "Unexpected public file: $path"
            }
          }
          $checksums = @{}
          foreach ($line in Get-Content -LiteralPath (Join-Path $root 'SHA256SUMS.txt')) {
            if ($line -cnotmatch '^([a-fA-F0-9]{64})  ([A-Za-z0-9._-]+)$') { throw 'Malformed checksum line.' }
            $name = $Matches[2]
            if ($name -cnotin @($payload, $installer, $manifestName) -or $checksums.ContainsKey($name)) {
              throw "Unexpected or duplicate checksum: $name"
            }
            $checksums[$name] = $Matches[1].ToLowerInvariant()
          }
          if ($checksums.Count -ne 3) { throw 'All three public content assets require checksums.' }
          foreach ($name in $checksums.Keys) {
            $file = Get-Item -LiteralPath (Join-Path $root $name)
            if ($file.Length -le 0 -or (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash -ine $checksums[$name]) {
              throw "Local asset hash mismatch: $name"
            }
          }
          $manifest = Get-Content -LiteralPath (Join-Path $root $manifestName) -Raw | ConvertFrom-Json
          $setup = Get-Item -LiteralPath (Join-Path $root $installer)
          $manifestKeys = @($manifest.PSObject.Properties.Name)
          $allowedKeys = @('schemaVersion', 'version', 'channel', 'installerAsset', 'sha256', 'size')
          if ($manifestKeys.Count -ne $allowedKeys.Count -or
              @($manifestKeys | Where-Object { $_ -cnotin $allowedKeys }).Count -ne 0) {
            throw 'Update manifest must contain exactly the six public schema fields.'
          }
          if (($manifest.schemaVersion -isnot [int] -and $manifest.schemaVersion -isnot [long]) -or
              ($manifest.size -isnot [int] -and $manifest.size -isnot [long]) -or
              $manifest.schemaVersion -ne 1 -or $manifest.version -cne $version -or
              $manifest.channel -cne 'stable' -or $manifest.installerAsset -cne $installer -or
              $manifest.sha256 -ine $checksums[$installer] -or $manifest.size -ne $setup.Length) {
            throw 'Update manifest does not match this version and installer.'
          }
          $baseUrl = "https://github.com/$env:GH_REPO/releases/download/$tag"
          $notesByVersion = @{
            '1.0.2' = @(
              '- Smoke Tester РїСЂР°РІРёР»СЊРЅРѕ РІРёС…РѕРґРёС‚СЊ С–Р· Р·Р°РІР°РЅС‚Р°Р¶СѓРІР°С‡Р°, СЏРєС‰Рѕ РїСЂРѕС€РёРІРєР° РІР¶Рµ Р°РєС‚СѓР°Р»СЊРЅР°.'
              '- Р”РѕРґР°РЅРѕ СЃРїРѕРІС–С‰РµРЅРЅСЏ РїСЂРѕ РЅРѕРІС– РІРµСЂСЃС–С— Р·Р°СЃС‚РѕСЃСѓРЅРєСѓ С‚Р° РІСЃС‚Р°РЅРѕРІР»РµРЅРЅСЏ РѕРЅРѕРІР»РµРЅСЊ.'
              '- РџСЂРёР±СЂР°РЅРѕ Р·Р°Р№РІС– РЅР°РїРёСЃРё Р№ РЅРёР¶РЅС–Р№ СЃС‚Р°С‚СѓСЃРЅРёР№ СЂСЏРґРѕРє.'
              '- Р’РёРїСЂР°РІР»РµРЅРѕ РІРёРіР»СЏРґ С–РЅРґРёРєР°С‚РѕСЂР° РїС–РґРєР»СЋС‡РµРЅРЅСЏ.'
            ) -join "`n"
            '1.0.4' = @(
              '- Р’С–РґРЅРѕРІР»РµРЅРѕ РЅР°РґС–Р№РЅСѓ РїРµСЂРµРІС–СЂРєСѓ С‚Р° РІСЃС‚Р°РЅРѕРІР»РµРЅРЅСЏ РѕРЅРѕРІР»РµРЅСЊ Р·Р°СЃС‚РѕСЃСѓРЅРєСѓ.'
              '- Р’РёРїСЂР°РІР»РµРЅРѕ РїРѕРјРёР»РєСѓ UTF-8 РїС–Рґ С‡Р°СЃ РїС–РґРіРѕС‚РѕРІРєРё С‚Р° Р·Р°РїРёСЃСѓ РїСЂРѕС€РёРІРєРё РЅР° Windows.'
              '- РџСЂРёР±СЂР°РЅРѕ СЂРѕР·СЂРёРІ РєРѕРЅС‚СѓСЂСѓ С–РЅРґРёРєР°С‚РѕСЂР° РїС–РґРєР»СЋС‡РµРЅРЅСЏ.'
            ) -join "`n"
            '1.0.5' = @(
              '- Р”РѕРґР°РЅРѕ РєРЅРѕРїРєСѓ В«РџРµСЂРµРІС–СЂРёС‚Рё РІРµСЂСЃС–СЋВ» РІ РЅР°Р»Р°С€С‚СѓРІР°РЅРЅСЏС… Р·Р°СЃС‚РѕСЃСѓРЅРєСѓ.'
              '- РџС–СЃР»СЏ РїРµСЂРµРІС–СЂРєРё РїРѕРєР°Р·СѓС”С‚СЊСЃСЏ, С‡Рё РІСЃС‚Р°РЅРѕРІР»РµРЅР° Р°РєС‚СѓР°Р»СЊРЅР° РІРµСЂСЃС–СЏ.'
            ) -join "`n"
            '1.0.6' = "- РџРѕРІС–РґРѕРјР»РµРЅРЅСЏ РїСЂРѕ РѕРЅРѕРІР»РµРЅРЅСЏ С‚РµРїРµСЂ РїР»Р°РІРЅРѕ Р·вЂ™СЏРІР»СЏС”С‚СЊСЃСЏ С‚Р° Р·Р°РєСЂРёРІР°С”С‚СЊСЃСЏ."
            '1.0.7' = "- РџС–Рґ С‡Р°СЃ РїРµСЂС€РѕРіРѕ РїСЂРѕС€РёРІР°РЅРЅСЏ Fire Tester С– Smoke Tester Р·Р±РµСЂС–РіР°С”С‚СЊСЃСЏ РґР°С‚Р° РІРёРіРѕС‚РѕРІР»РµРЅРЅСЏ. РџРѕРґР°Р»СЊС€С– РѕРЅРѕРІР»РµРЅРЅСЏ С—С— РЅРµ Р·РјС–РЅСЋСЋС‚СЊ."
            '1.0.8' = @(
              '- РџРµСЂРµРґ РїСЂРѕС€РёРІР°РЅРЅСЏРј РїРѕРєР°Р·СѓС”С‚СЊСЃСЏ РґР°С‚Р° РІРёСЂРѕР±РЅРёС†С‚РІР°: Р·Р±РµСЂРµР¶РµРЅР° Р°Р±Рѕ С‚Р°, С‰Рѕ Р±СѓРґРµ Р·Р°РїРёСЃР°РЅР°.'
              '- Р”Р°С‚Р° РЅР° РµРєСЂР°РЅС– Р·Р°Р»РёС€Р°С”С‚СЊСЃСЏ РЅРµР·РјС–РЅРЅРѕСЋ РґРѕ Р·Р°РІРµСЂС€РµРЅРЅСЏ Р·Р°РїРёСЃСѓ.'
            ) -join "`n"
            '1.0.9' = @(
              '- Р”Р°С‚Р° РІРёСЂРѕР±РЅРёС†С‚РІР° С‚РµРїРµСЂ РЅР°Рґ Р±Р»РѕРєРѕРј РїСЂРѕС€РёРІРєРё С‚Р° РЅР° РµРєСЂР°РЅС– В«Р“РѕС‚РѕРІРѕВ».'
              '- Р”РѕРґР°РЅРѕ РїС–РґС‚СЂРёРјРєСѓ РґР°С‚Рё РІРёСЂРѕР±РЅРёС†С‚РІР° РґР»СЏ Twin Button.'
            ) -join "`n"
            '1.0.10' = @(
              '- РџС–СЃР»СЏ РІСЃС‚Р°РЅРѕРІР»РµРЅРЅСЏ РјРѕР¶РЅР° РІРёР±СЂР°С‚Рё, С‡Рё РІС–РґРєСЂРёС‚Рё Р·Р°СЃС‚РѕСЃСѓРЅРѕРє.'
              '- РџС–СЃР»СЏ РѕРЅРѕРІР»РµРЅРЅСЏ Р·Р°СЃС‚РѕСЃСѓРЅРѕРє РІС–РґРєСЂРёРІР°С”С‚СЊСЃСЏ Р°РІС‚РѕРјР°С‚РёС‡РЅРѕ.'
              '- Р’РёСЂС–РІРЅСЏРЅРѕ С–РЅС„РѕСЂРјР°С†С–СЋ РїСЂРѕ РїСЂРёСЃС‚СЂС–Р№ РЅР° РµРєСЂР°РЅР°С… РїС–РґРіРѕС‚РѕРІРєРё Р№ Р·Р°РІРµСЂС€РµРЅРЅСЏ.'
            ) -join "`n"
          }
          $notesByVersion['1.0.11'] = @(
            '- Р’РёРїСЂР°РІР»РµРЅРѕ Р·Р°РІРёСЃР°РЅРЅСЏ РїСЂРѕРіСЂРµСЃСѓ РїС–Рґ С‡Р°СЃ Р·Р°РїРёСЃСѓ РїСЂРѕС€РёРІРєРё.'
            '- Р§Р°СЃ РґРѕ Р·Р°РІРµСЂС€РµРЅРЅСЏ Р·Р°РїРёСЃСѓ СЂРѕР·СЂР°С…РѕРІСѓС”С‚СЊСЃСЏ Р·Р° С€РІРёРґРєС–СЃС‚СЋ РїРµСЂРµРґР°РІР°РЅРЅСЏ С‚Р° РїР»Р°РІРЅРѕ СѓС‚РѕС‡РЅСЋС”С‚СЊСЃСЏ.'
            '- Р’РёРїСЂР°РІР»РµРЅРѕ РїРѕРјРёР»РєРё С–РЅС‚РµСЂС„РµР№СЃСѓ РїС–Рґ С‡Р°СЃ Р·РіРѕСЂС‚Р°РЅРЅСЏ Р№ Р·РјС–РЅРё СЂРѕР·РјС–СЂСѓ РІС–РєРЅР°.'
            '- РЈС‚РѕС‡РЅРµРЅРѕ РІРёСЂС–РІРЅСЋРІР°РЅРЅСЏ С–РЅС„РѕСЂРјР°С†С–С— РїСЂРѕ РїСЂРёСЃС‚СЂС–Р№.'
          ) -join "`n"
          $notesByVersion['1.0.12'] = @(
            '- Р’РёРїСЂР°РІР»РµРЅРѕ Р·Р°РІР°РЅС‚Р°Р¶РµРЅРЅСЏ РїСЂРѕС€РёРІРєРё, РєРѕР»Рё GitHub С‚РёРјС‡Р°СЃРѕРІРѕ РїРѕРІРµСЂС‚Р°С” Р·Р°СЃС‚Р°СЂС–Р»РёР№ РѕРїРёСЃ С„Р°Р№Р»С–РІ.'
            '- РћС‡С– С‚Р° СЏР·РёРє РїР°СЃС…Р°Р»СЊРЅРѕС— Р·РјС–Р№РєРё РїР»Р°РІРЅРѕ Р·РЅРёРєР°СЋС‚СЊ РЅР°РїСЂРёРєС–РЅС†С– Р·Р°РІР°РЅС‚Р°Р¶РµРЅРЅСЏ.'
          ) -join "`n"
          $notesByVersion['1.0.13'] = @(
            '- Р—РјС–Р№РєР° РЅР°РїСЂРёРєС–РЅС†С– Р·Р°РІР°РЅС‚Р°Р¶РµРЅРЅСЏ РїР»Р°РІРЅРѕ С…РѕРІР°С” РѕС‡С– С‚Р° СЏР·РёРє Р±РµР· СЂС–Р·РєРѕРіРѕ Р·РЅРёРєРЅРµРЅРЅСЏ.'
          ) -join "`n"
          $notesByVersion['1.0.14'] = @(
            '- Р§Р°СЃ РґРѕ Р·Р°РїСѓСЃРєСѓ РїСЂРёСЃС‚СЂРѕСЋ РІСЂР°С…РѕРІСѓС” Р·Р°РІР°РЅС‚Р°Р¶РµРЅРЅСЏ, Р·Р°РїРёСЃ, РїРµСЂРµРІС–СЂРєСѓ С‚Р° РїРµСЂРµР·Р°РїСѓСЃРє.'
            '- Р’С–РґР»С–Рє РЅРµ Р·РЅРёРєР°С” РјС–Р¶ РѕРїРµСЂР°С†С–СЏРјРё С‚Р° РїР»Р°РІРЅРѕ СѓС‚РѕС‡РЅСЋС”С‚СЊСЃСЏ РїС–Рґ С‡Р°СЃ СЂРѕР±РѕС‚Рё.'
          ) -join "`n"
          $notesByVersion['1.0.15'] = @(
            '- РќР°Р·РІР° РїСЂРёСЃС‚СЂРѕСЋ Р·Р°Р»РёС€Р°С”С‚СЊСЃСЏ РЅР° РѕРґРЅС–Р№ РІРёСЃРѕС‚С– РЅР° СЂС–Р·РЅРёС… РµРєСЂР°РЅР°С….'
            '- Р РѕР·РјС–СЂ РЅР°Р·РІРё СѓР·РіРѕРґР¶РµРЅРѕ С–Р· Р·Р°РіРѕР»РѕРІРєРѕРј, Р·РѕРєСЂРµРјР° РїСЂРё Р·Р±С–Р»СЊС€РµРЅРЅС– С‚РµРєСЃС‚Сѓ.'
          ) -join "`n"
          $notesByVersion['1.0.16'] = @(
            '- Р§Р°СЃ РґРѕ Р·Р°РїСѓСЃРєСѓ РїСЂРёСЃС‚СЂРѕСЋ РІС–РґРѕР±СЂР°Р¶Р°С”С‚СЊСЃСЏ РїРѕСЃРµРєСѓРЅРґРЅРѕ, Р±РµР· РєСЂРѕРєС–РІ РїРѕ 5 СЃРµРєСѓРЅРґ.'
            '- Р’С–РґР»С–Рє РїСЂРѕРґРѕРІР¶СѓС”С‚СЊСЃСЏ РїС–Рґ С‡Р°СЃ РїР°СѓР· РјС–Р¶ РїРѕРІС–РґРѕРјР»РµРЅРЅСЏРјРё РїСЂРѕ РїСЂРѕРіСЂРµСЃ.'
          ) -join "`n"
          $notesByVersion['1.0.17'] = @(
            '- РџС–РґРїРёСЃ РІС–РґР»С–РєСѓ Р·РјС–РЅРµРЅРѕ РЅР° В«РґРѕ Р·Р°РІРµСЂС€РµРЅРЅСЏВ» РґР»СЏ РІСЃС–С… РѕРїРµСЂР°С†С–Р№ РѕРЅРѕРІР»РµРЅРЅСЏ.'
          ) -join "`n"
          $notesByVersion['1.0.19'] = '- Виправлено reset BIOS-порту перед прошивкою через USB.'
          if (-not $notesByVersion.ContainsKey($version)) {
            throw "No approved release notes for version $version."
          }
          $notes = $notesByVersion[$version]
          $notesPath = Join-Path $env:RUNNER_TEMP "release-notes-$tag.md"
          [IO.File]::WriteAllText($notesPath, $notes)
          $releases = (Invoke-Gh api --paginate --slurp 'repos/{owner}/{repo}/releases?per_page=100' | ConvertFrom-Json)
          $existing = @($releases | ForEach-Object { $_ } | Where-Object { $_.tag_name -ceq $tag })
          if ($existing.Count -gt 1) { throw 'Duplicate release tag.' }
          if ($existing.Count -eq 0) {
            Invoke-Gh release create $tag --verify-tag --draft --latest=false --title "TIRAS Service Manufacturing $version" --notes-file $notesPath
          }
          $release = Invoke-Gh release view $tag --json 'assets,isDraft,isPrerelease' | ConvertFrom-Json
          if ($release.isPrerelease) { throw 'A stable application release cannot be a prerelease.' }
          foreach ($remoteAsset in $release.assets) {
            if ($remoteAsset.name -cnotin $assetNames) { throw "Unexpected remote asset: $($remoteAsset.name)" }
          }
          if ($release.isDraft) {
            # The array order makes the payload available before uploading the installer.
            foreach ($name in $assetNames) {
              if ($name -cnotin @($release.assets | ForEach-Object { $_.name })) {
                Invoke-Gh release upload $tag (Join-Path $root $name)
              }
            }
          } elseif (@($release.assets).Count -ne $assetNames.Count) {
            throw 'Published releases must already contain exactly the four approved assets; no uploads or replacements are permitted.'
          }
          $downloadRoot = Join-Path $env:RUNNER_TEMP "verify-$tag-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Path $downloadRoot | Out-Null
          Invoke-Gh release download $tag --dir $downloadRoot
          if (@(Get-ChildItem -LiteralPath $downloadRoot -File).Count -ne $assetNames.Count) {
            throw 'Remote asset count mismatch.'
          }
          foreach ($name in $assetNames) {
            $local = Get-Item -LiteralPath (Join-Path $root $name)
            $remote = Get-Item -LiteralPath (Join-Path $downloadRoot $name)
            if ($remote.Length -ne $local.Length -or
                (Get-FileHash -LiteralPath $remote.FullName).Hash -cne (Get-FileHash -LiteralPath $local.FullName).Hash) {
              throw "Downloaded release asset differs: $name"
            }
          }
          # Publish without changing latest, then prove anonymous downloads before promotion.
          if ($release.isDraft) {
            Invoke-Gh release edit $tag --draft=false --latest=false
          }
          foreach ($name in $assetNames) {
            $destination = Join-Path $downloadRoot "public-$name"
            & curl.exe --fail --location --retry 5 --retry-all-errors --retry-delay 3 --max-time 180 --silent --show-error --output $destination "$baseUrl/$name"
            if ($LASTEXITCODE -ne 0) { throw "Anonymous asset download failed: $name" }
            if ((Get-FileHash -LiteralPath $destination).Hash -cne (Get-FileHash -LiteralPath (Join-Path $root $name)).Hash) {
              throw "Anonymous asset hash mismatch: $name"
            }
          }
          # Keep user-facing release notes identical on creation and verified reruns.
          Invoke-Gh release edit $tag --notes-file $notesPath
          $latest = Invoke-Gh api 'repos/{owner}/{repo}/releases/latest' | ConvertFrom-Json
          $feedFile = Invoke-Gh api 'repos/{owner}/{repo}/contents/latest.json?ref=main' | ConvertFrom-Json
          $currentFeed = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($feedFile.content)) | ConvertFrom-Json
          Assert-PublicFeed $currentFeed
          if (-not (Test-CanPromoteRelease $tag $latest.tag_name $currentFeed.tag_name)) {
            "Verified $tag; preserving newer latest release or public feed."
            exit 0
          }
          if ($latest.tag_name -cne $tag) {
            Invoke-Gh release edit $tag --latest
          }
          $latest = Invoke-Gh api 'repos/{owner}/{repo}/releases/latest' | ConvertFrom-Json
          if ($latest.tag_name -cne $tag -or $latest.draft -or $latest.prerelease) {
            throw 'Latest release does not match the verified stable tag.'
          }
          $newFeed = [ordered]@{
            draft = $false
            prerelease = $false
            tag_name = $tag
            html_url = "https://github.com/$env:GH_REPO/releases/tag/$tag"
            body = $notes
            assets = @($assetNames | ForEach-Object {
              [ordered]@{
                name = $_
                size = (Get-Item -LiteralPath (Join-Path $root $_)).Length
                browser_download_url = "$baseUrl/$_"
              }
            })
          }
          $feedJson = $newFeed | ConvertTo-Json -Depth 5
          Assert-PublicFeed ($feedJson | ConvertFrom-Json)
          $feedUpdate = [ordered]@{
            message = "Publish verified application feed $tag"
            branch = 'main'
            sha = $feedFile.sha
            content = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($feedJson))
          }
          $feedRequestPath = Join-Path $env:RUNNER_TEMP "feed-update-$tag.json"
          [IO.File]::WriteAllText($feedRequestPath, ($feedUpdate | ConvertTo-Json))
          # Contents API compares the existing blob SHA; a concurrent feed change fails safely.
          $feedWrite = Invoke-Gh api --method PUT 'repos/{owner}/{repo}/contents/latest.json' --input $feedRequestPath | ConvertFrom-Json
          $publicFeedPath = Join-Path $downloadRoot 'published-latest.json'
          $rawFeedUrl = "https://raw.githubusercontent.com/$env:GH_REPO/main/latest.json?commit=$($feedWrite.commit.sha)"
          & curl.exe --fail --location --retry 5 --retry-all-errors --retry-delay 3 --max-time 60 --silent --show-error --output $publicFeedPath $rawFeedUrl
          if ($LASTEXITCODE -ne 0) { throw 'Anonymous update feed download failed.' }
          $publishedFeedJson = [IO.File]::ReadAllText($publicFeedPath)
          if ($publishedFeedJson -cne $feedJson) { throw 'Published update feed differs from the verified content.' }
          Assert-PublicFeed ($publishedFeedJson | ConvertFrom-Json)
          "Published and verified $tag with $($assetNames.Count) public assets and the public update feed."

